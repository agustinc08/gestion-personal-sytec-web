# Sirve el build en la raíz: Traefik saca el prefijo público (/gestion-personal-sytec o /gestion-personal-sytec-dev) antes de
# llegar acá. La API no pasa por este nginx: Traefik rutea /gestion-personal-sytec-api directo al contenedor de
# la API (ver deploy/docker-compose.yml).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los assets llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fallback SPA: cualquier ruta devuelve index.html (la app navega por query string, ?seccion=...).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
